<!DOCTYPE html>

    <meta charset="UTF-8">

<!-- Créez un bouton HTML. En JavaScript, sélectionnez ce bouton et attachez-y un écouteur d'événement click. Lors du clic, 
affichez simplement un message dans la console ou via une alert(). -->

<body>
    <button id="btn">Cliquez-moi</button>
</body>

<script>
    const bouton1 = document.getElementById("btn");
    bouton1.addEventListener("click" , () => {
        console.log("Le bouton a été cliqué !");
        
    })
</script>


</html>
