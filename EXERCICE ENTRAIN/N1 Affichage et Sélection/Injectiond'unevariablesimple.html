Affichage et Sélection — L'injection de données

Énoncé

Affichage et Sélection — L'injection de données

Énoncé
Reprenez l'objet précédent. Cette fois, les éléments de la Card n'ont pas d'ID, mais des classes (.card-title, .card-email, etc.).
 Sélectionnez d'abord l'élément parent (la Card entière). Ensuite, utilisez parent.querySelector('.class') pour cibler les éléments 
 enfants et injecter les données de l'objet. -->


 <article class="cardusercard">
  <h2 class="card-titlee"></h2>
  <p class="card-emaill"></p>

<!-- Votre tableau contient des objets utilisateurs ayant chacun un ID unique. Vos Cards HTML statiques
