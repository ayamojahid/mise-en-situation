<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<body>
    <!-- Vous avez un tableau d'objets (produits avec titre, prix, image). Utilisez la propriété innerHTML 
    combinée aux backticks (template literals `) pour générer l'ensemble du HTML (des Cards complexes) 
    sous forme de chaîne de caractères en une seule boucle, puis injectez le résultat dans un conteneur. -->


    <style>
  .product-card { border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; background: #fff; }
.product-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: #f1f5f9;
    width: 250px;
}  .product-card .body { padding: 10px 12px; }
  .product-card h3 { margin: 0 0 4px; font-size: 1rem; }
  .product-card .price { margin: 0; color: #1d4ed8; font-weight: 600; }
.grid {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}</style>
 
<div id="products" class="grid"></div>


</body>
<script>
    const products = [
  { titre: "Casque audio", prix: 89.9, image: "/images/casque.png" },
  { titre: "Montre classique", prix: 129, image: "/images/montre.png" },
  { titre: "Sac à dos", prix: 59.5, image: "/images/sac.png" },
];
const divprod =document.getElementById("products")

products.forEach(element => {
    const div=document.createElement("div");
    console.log(div);
    div.classList.add("product-card");

    const img=document.createElement("img");
    img.setAttribute("src" , element.image);
    img.setAttribute("alt" , element.titre);

    const title=document.createElement("h3");
    title.textContent=element.titre;

    const p =document.createElement("p");
    p.textContent=`${element.prix.toFixed(2)} Dh`;
    p.classList.add("price");

    div.appendChild(title , p);
divprod.appendChild(div , img);

});

   


</script>


</html>
